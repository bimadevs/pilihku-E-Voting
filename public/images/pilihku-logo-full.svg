<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180" fill="none">
  <defs>
    <linearGradient id="fStemG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="fLoopG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <linearGradient id="fCheckG" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="fTextKuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E3A8A" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 10) scale(0.625)" filter="url(#fShadow)">
    <rect x="46" y="36" width="36" height="184" rx="18" fill="url(#fStemG)" />
    <path d="M 64 36 C 124 36, 178 52, 178 88 C 178 124, 124 140, 64 140" stroke="url(#fLoopG)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 64 42 C 114 42, 160 56, 160 88" stroke="#93C5FD" stroke-width="6" stroke-linecap="round" opacity="0.6" fill="none" />
    <path d="M 104 116 L 134 146 C 139 151, 147 151, 152 146 L 218 72 C 225 64, 222 52, 212 48 C 203 44, 193 47, 187 55 L 143 115 L 128 100 C 121 93, 110 93, 104 100 C 97 106, 97 110, 104 116 Z" fill="url(#fCheckG)" />
    <circle cx="218" cy="46" r="6" fill="#FDE047" />
  </g>

  <!-- Right Typography -->
  <g transform="translate(180, 102)">
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="72" font-weight="900" fill="#0F172A" letter-spacing="-1.5">Pilih</text>
    <text x="172" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="72" font-weight="900" fill="url(#fTextKuGrad)" letter-spacing="-1.5">Ku</text>

    <!-- OSIS Badge -->
    <rect x="292" y="-52" width="76" height="32" rx="9" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" />
    <text x="330" y="-31" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" fill="#1D4ED8" letter-spacing="1.5">OSIS</text>

    <!-- Subtitle -->
    <text x="3" y="34" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#64748B" letter-spacing="0.5">SISTEM E-VOTING RESMI</text>
  </g>
