<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="sqBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="60%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="sqStemG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="sqLoopG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="sqCheckG" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="sqBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <filter id="sqCardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.4" />
    </filter>

    <filter id="sqIconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>

    <filter id="sqCheckGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#047857" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#sqBgGrad)" filter="url(#sqCardShadow)" />
  <rect x="33.5" y="33.5" width="445" height="445" rx="102.5" stroke="url(#sqBorderGrad)" stroke-width="3" fill="none" />

  <!-- Ambient Light Core -->
  <circle cx="280" cy="220" r="150" fill="#38BDF8" opacity="0.22" filter="blur(32px)" />

  <!-- Icon Centered & Scaled inside Squircle -->
  <g transform="translate(100, 100) scale(1.22)" filter="url(#sqIconShadow)">
    <rect x="46" y="36" width="36" height="184" rx="18" fill="url(#sqStemG)" />
    <path d="M 64 36 C 124 36, 178 52, 178 88 C 178 124, 124 140, 64 140" stroke="url(#sqLoopG)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <g filter="url(#sqCheckGlow)">
      <path d="M 104 116 L 134 146 C 139 151, 147 151, 152 146 L 218 72 C 225 64, 222 52, 212 48 C 203 44, 193 47, 187 55 L 143 115 L 128 100 C 121 93, 110 93, 104 100 C 97 106, 97 110, 104 116 Z" fill="url(#sqCheckG)" />
      <circle cx="218" cy="46" r="6" fill="#FDE047" />
      <circle cx="218" cy="46" r="14" fill="#FBBF24" opacity="0.45" />
    </g>
  </g>
</svg>