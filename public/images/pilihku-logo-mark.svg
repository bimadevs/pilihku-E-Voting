<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Gradien Batang P -->
    <linearGradient id="pStemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Gradien Loop P: Halus dari Biru Muda ke Royal Blue -->
    <linearGradient id="pLoopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Gradien Centang Suara (Emerald to Mint) -->
    <linearGradient id="pCheckGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <filter id="shadowP" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1E3A8A" flood-opacity="0.25" />
    </filter>
    
    <filter id="checkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#047857" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#shadowP)">
    <!-- 1. Batang Pilar Tegak "P" -->
    <rect x="46" y="36" width="36" height="184" rx="18" fill="url(#pStemGrad)" />

    <!-- 2. Loop Huruf "P" yang mulus dan elegan -->
    <path d="M 64 36 
             C 124 36, 178 52, 178 88 
             C 178 124, 124 140, 64 140" 
          stroke="url(#pLoopGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />

    <!-- 3. Dynamic Checkmark melesat melewati P -->
    <g filter="url(#checkGlow)">
      <path d="M 104 116 
               L 134 146 
               C 139 151, 147 151, 152 146 
               L 218 72 
               C 225 64, 222 52, 212 48 
               C 203 44, 193 47, 187 55 
               L 143 115 
               L 128 100 
               C 121 93, 110 93, 104 100 
               C 97 106, 97 110, 104 116 Z" 
            fill="url(#pCheckGrad)" />
      
      <!-- Sparkle Bintang Kemenangan di Ujung Centang -->
      <circle cx="218" cy="46" r="6" fill="#FDE047" />
      <circle cx="218" cy="46" r="12" fill="#FBBF24" opacity="0.4" />
    </g>
  </g>
</svg>